name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Two jobs. The source gate checks the things that are true of the
# repository whatever the compiler does, and the test job runs the suite
# against a released twill. The second one is new: until twill 1.6 there
# was no compiler that could run this code, and the comment here used to
# say so.
jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every source file is twill
        run: |
          stray=$(find . -path ./.git -prune -o -type f \
            ! -name '*.tw' ! -name '*.md' ! -name '*.yml' ! -name '*.toml' \
            ! -name 'LICENSE' ! -name '.gitignore' -print)
          if [ -n "$stray" ]; then
            echo "heddle is written in twill; these files are neither .tw nor documentation:"
            echo "$stray"
            exit 1
          fi

      - name: No reference to the old language name
        run: |
          old=$(printf 'ras'; printf 'ter')
          if grep -rni "$old" --include='*.tw' --include='*.md' --include='*.toml' .; then
            echo "the language is twill"
            exit 1
          fi

      - name: No file carries the old source extension
        run: |
          old=$(printf '*.r'; printf 'a')
          if find . -name "$old" | grep .; then
            echo "twill source is .tw"
            exit 1
          fi
          if grep -rn "$(printf '\\.r'; printf 'a\\b')" --include='*.tw' --include='*.md' .; then
            echo "twill source is .tw"
            exit 1
          fi

      - name: No em dashes
        run: |
          dash=$(printf '\xe2\x80\x94')
          if grep -rn "$dash" --include='*.tw' --include='*.md' --include='*.toml' --include='*.yml' .; then
            echo "em dashes are not used in this repository"
            exit 1
          fi

      - name: Every twill source declares its mode
        run: |
          for f in $(find . -name '*.tw'); do
            if [ "$(head -n 1 "$f")" != "mode systems" ]; then
              echo "$f does not start with 'mode systems'"
              exit 1
            fi
          done


      - name: Every needs entry names a file
        run: |
          # A needs entry without a file to look at is a wish, not a work item.
          missing=$(grep -c '^### ' docs/needs.md)
          named=$(grep -c '^\*\*\(Used by\|Would improve\|Needs\)' docs/needs.md)
          if [ "$named" -lt "$missing" ]; then
            echo "docs/needs.md has $missing entries and only $named name a file"
            exit 1
          fi

      - name: Every test file reports
        run: |
          # A test file that never calls `report` exits zero however many cases
          # failed, so CI would pass on a red suite the day this runs for real.
          for f in tests/*_test.tw; do
            grep -q 't.report(' "$f" || {
              echo "$f does not call t.report"
              exit 1
            }
          done

      - name: Every source module has a test file
        run: |
          # Not a coverage target. It is a check that a module was not added
          # without anyone deciding what it should do.
          missing=""
          for f in src/*.tw; do
            base=$(basename "$f" .tw)
            # vec and chain are data carriers with no behaviour of their own.
            # adapt is covered by tests/model_test.tw and rwm by
            # tests/nuts_test.tw, where each is tested against the thing it
            # exists to serve rather than in isolation.
            case "$base" in
              vec|chain|adapt|rwm) continue ;;
            esac
            if [ ! -f "tests/${base}_test.tw" ]; then
              missing="$missing $base"
            fi
          done
          if [ -n "$missing" ]; then
            echo "these modules have no test file:$missing"
            exit 1
          fi

      - name: The Jacobian claim is tested
        run: |
          # docs/needs.md and README.md both say a wrong Jacobian silently
          # biases the posterior. That claim earns its place only if something
          # checks it.
          grep -q 'jacobian' tests/transform_test.tw || {
            echo "tests/transform_test.tw must check the Jacobians"
            exit 1
          }

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The twill binary comes from a release rather than being built here.
      # heddle is written in twill and has no build of its own, so the only
      # thing CI needs is a compiler, and a released one is the version a user
      # would have. Pinned rather than floating: a green run should mean this
      # code passed against a known compiler, not against whatever was newest
      # that morning.
      - name: Install twill v1.12.0
        run: |
          curl -fsSL -o twill \
            https://github.com/twill-lang/twill/releases/download/v1.12.0/twill-v1.12.0-linux-amd64
          chmod +x twill
          ./twill --version

      # Every .tw file in the repository, not a fixed list of directories.
      # The list used to be `src tests examples`, which silently excluded
      # anything else: bobbin's suites/ and spool's main.tw were both real
      # programs that CI never checked, and both were broken because of it.
      - name: Check every source file
        run: |
          skip=""
          fail=0
          for f in $(find . -name '*.tw'); do
            case " $skip " in *" $f "*) continue ;; esac
            if ! ./twill check "$f"; then
              fail=1
            fi
          done
          exit $fail

      - name: Run the tests
        run: ./twill test tests

      # No example-run step. heddle's examples are NUTS runs, and its own
      # docs/needs.md says a NUTS run takes "minutes to hours" -- the tests job
      # above is already the slowest in the ecosystem for the same reason.
      # They are checked, not run, and that is a cost decision rather than an
      # oversight.
